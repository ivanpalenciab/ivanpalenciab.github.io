<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Background -->
  <rect width="800" height="480" fill="#0D1117" rx="12" />
  <rect x="1" y="1" width="798" height="478" rx="11" stroke="#30363D" stroke-width="2" />

  <!-- App Header -->
  <rect x="0" y="0" width="800" height="50" fill="#161B22" rx="12" />
  <rect x="0" y="38" width="800" height="12" fill="#161B22" />
  <line x1="0" y1="50" x2="800" y2="50" stroke="#30363D" stroke-width="1" />
  <circle cx="28" cy="25" r="6" fill="#EF4444" opacity="0.8" />
  <circle cx="48" cy="25" r="6" fill="#F59E0B" opacity="0.8" />
  <circle cx="68" cy="25" r="6" fill="#10B981" opacity="0.8" />
  <rect x="100" y="14" width="270" height="22" rx="6" fill="#0D1117" />
  <text x="114" y="29" fill="#58A6FF" font-size="11" font-weight="500">api.gateway.internal / v1 / data-pipelines</text>

  <rect x="630" y="14" width="140" height="22" rx="6" fill="#1F6FEB" fill-opacity="0.15" stroke="#1F6FEB" stroke-width="1" />
  <circle cx="644" cy="25" r="3.5" fill="#58A6FF" />
  <text x="654" y="29" fill="#58A6FF" font-size="11" font-weight="600">FastAPI + Async</text>

  <!-- Top Architecture Diagram Panel -->
  <g transform="translate(24, 70)">
    <rect width="752" height="175" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="20" y="26" fill="#F0F6FC" font-size="13" font-weight="700">Flujo de Integración y Procesamiento de Servicios</text>
    <text x="20" y="44" fill="#8B949E" font-size="11">Desacoplamiento de fuentes, validación de esquemas e ingesta continua</text>

    <!-- Node 1: Fuentes Externas -->
    <g transform="translate(30, 65)">
      <rect width="130" height="85" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1" />
      <rect x="10" y="12" width="24" height="24" rx="4" fill="#6E7681" fill-opacity="0.2" />
      <text x="42" y="28" fill="#F0F6FC" font-size="11" font-weight="600">Fuentes</text>
      <text x="12" y="52" fill="#8B949E" font-size="10">ERP, CRM, Webhooks</text>
      <text x="12" y="70" fill="#2AA539" font-size="10" font-weight="600">Ingesta HTTP / REST</text>
    </g>

    <!-- Arrow 1 -->
    <line x1="160" y1="107" x2="210" y2="107" stroke="#58A6FF" stroke-width="2" stroke-dasharray="3 3" />
    <polygon points="210,103 218,107 210,111" fill="#58A6FF" />

    <!-- Node 2: FastAPI Gateway -->
    <g transform="translate(220, 65)">
      <rect width="145" height="85" rx="6" fill="#21262D" stroke="#58A6FF" stroke-width="1.5" />
      <rect x="10" y="12" width="24" height="24" rx="4" fill="#1F6FEB" fill-opacity="0.3" />
      <text x="42" y="28" fill="#58A6FF" font-size="11" font-weight="700">FastAPI Gateway</text>
      <text x="12" y="52" fill="#8B949E" font-size="10">Pydantic Schemas</text>
      <text x="12" y="70" fill="#F0F6FC" font-size="10">Auth JWT + Rate Limit</text>
    </g>

    <!-- Arrow 2 -->
    <line x1="365" y1="107" x2="415" y2="107" stroke="#58A6FF" stroke-width="2" stroke-dasharray="3 3" />
    <polygon points="415,103 423,107 415,111" fill="#58A6FF" />

    <!-- Node 3: Transform & Buffer -->
    <g transform="translate(425, 65)">
      <rect width="140" height="85" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1" />
      <rect x="10" y="12" width="24" height="24" rx="4" fill="#2AA539" fill-opacity="0.2" />
      <text x="42" y="28" fill="#F0F6FC" font-size="11" font-weight="600">Transformación</text>
      <text x="12" y="52" fill="#8B949E" font-size="10">Polars Batch Worker</text>
      <text x="12" y="70" fill="#2AA539" font-size="10" font-weight="600">Deduplicación & Limpieza</text>
    </g>

    <!-- Arrow 3 -->
    <line x1="565" y1="107" x2="615" y2="107" stroke="#58A6FF" stroke-width="2" stroke-dasharray="3 3" />
    <polygon points="615,103 623,107 615,111" fill="#58A6FF" />

    <!-- Node 4: Warehouse / DB -->
    <g transform="translate(625, 65)">
      <rect width="112" height="85" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1" />
      <rect x="10" y="12" width="24" height="24" rx="4" fill="#E3B341" fill-opacity="0.2" />
      <text x="42" y="28" fill="#F0F6FC" font-size="11" font-weight="600">Destino</text>
      <text x="12" y="52" fill="#8B949E" font-size="10">PostgreSQL</text>
      <text x="12" y="70" fill="#E3B341" font-size="10" font-weight="600">Data Marts</text>
    </g>
  </g>

  <!-- Bottom Left: Endpoints Specs -->
  <g transform="translate(24, 260)">
    <rect width="365" height="195" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="18" y="28" fill="#F0F6FC" font-size="12" font-weight="600">Endpoints y Servicios Expuestos</text>

    <!-- Endpoint 1 -->
    <g transform="translate(18, 45)">
      <rect width="46" height="20" rx="4" fill="#238636" />
      <text x="10" y="14" fill="#FFFFFF" font-size="10" font-weight="700">POST</text>
      <text x="56" y="15" fill="#F0F6FC" font-size="11" font-weight="500">/v1/sync/transactions</text>
      <text x="290" y="15" fill="#8B949E" font-size="10">28 ms</text>
    </g>

    <!-- Endpoint 2 -->
    <g transform="translate(18, 78)">
      <rect width="46" height="20" rx="4" fill="#1F6FEB" />
      <text x="12" y="14" fill="#FFFFFF" font-size="10" font-weight="700">GET</text>
      <text x="56" y="15" fill="#F0F6FC" font-size="11" font-weight="500">/v1/analytics/indicators</text>
      <text x="290" y="15" fill="#8B949E" font-size="10">14 ms</text>
    </g>

    <!-- Endpoint 3 -->
    <g transform="translate(18, 111)">
      <rect width="46" height="20" rx="4" fill="#1F6FEB" />
      <text x="12" y="14" fill="#FFFFFF" font-size="10" font-weight="700">GET</text>
      <text x="56" y="15" fill="#F0F6FC" font-size="11" font-weight="500">/v1/reports/export.parquet</text>
      <text x="290" y="15" fill="#8B949E" font-size="10">42 ms</text>
    </g>

    <!-- Endpoint 4 -->
    <g transform="translate(18, 144)">
      <rect width="46" height="20" rx="4" fill="#D29922" />
      <text x="14" y="14" fill="#FFFFFF" font-size="10" font-weight="700">PUT</text>
      <text x="56" y="15" fill="#F0F6FC" font-size="11" font-weight="500">/v1/schemas/validate</text>
      <text x="290" y="15" fill="#8B949E" font-size="10">8 ms</text>
    </g>
  </g>

  <!-- Bottom Right: JSON Response preview -->
  <g transform="translate(405, 260)">
    <rect width="371" height="195" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <rect x="0" y="0" width="371" height="28" fill="#21262D" rx="8" />
    <rect x="0" y="20" width="371" height="8" fill="#21262D" />
    <text x="16" y="19" fill="#8B949E" font-size="11" font-family="monospace">response.json (HTTP 200 OK)</text>

    <g font-family="monospace" font-size="11" transform="translate(16, 46)">
      <text x="0" y="12" fill="#E6EDF3">{</text>
      <text x="15" y="30" fill="#79C0FF">"status"</text><text x="75" y="30" fill="#E6EDF3">: </text><text x="90" y="30" fill="#7EE787">"success"</text><text x="150" y="30" fill="#E6EDF3">,</text>
      <text x="15" y="48" fill="#79C0FF">"records_processed"</text><text x="160" y="48" fill="#E6EDF3">: </text><text x="175" y="48" fill="#D2A8FF">42580</text><text x="220" y="48" fill="#E6EDF3">,</text>
      <text x="15" y="66" fill="#79C0FF">"processing_time_ms"</text><text x="170" y="66" fill="#E6EDF3">: </text><text x="185" y="66" fill="#D2A8FF">19.4</text><text x="215" y="66" fill="#E6EDF3">,</text>
      <text x="15" y="84" fill="#79C0FF">"validation_errors"</text><text x="160" y="84" fill="#E6EDF3">: </text><text x="175" y="84" fill="#D2A8FF">0</text><text x="185" y="84" fill="#E6EDF3">,</text>
      <text x="15" y="102" fill="#79C0FF">"pipeline_sync"</text><text x="125" y="102" fill="#E6EDF3">: </text><text x="140" y="102" fill="#79C0FF">true</text>
      <text x="0" y="122" fill="#E6EDF3">}</text>
    </g>
  </g>
</svg>
