<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Background -->
  <rect width="800" height="480" fill="#0C1A14" rx="12" />
  <rect x="1" y="1" width="798" height="478" rx="11" stroke="#1C3D2B" stroke-width="2" />

  <!-- App Header -->
  <rect x="0" y="0" width="800" height="50" fill="#142B20" rx="12" />
  <rect x="0" y="38" width="800" height="12" fill="#142B20" />
  <line x1="0" y1="50" x2="800" y2="50" stroke="#1C3D2B" stroke-width="1" />
  <circle cx="28" cy="25" r="6" fill="#EF4444" opacity="0.8" />
  <circle cx="48" cy="25" r="6" fill="#F59E0B" opacity="0.8" />
  <circle cx="68" cy="25" r="6" fill="#10B981" opacity="0.8" />
  <rect x="100" y="14" width="280" height="22" rx="6" fill="#0C1A14" />
  <text x="114" y="29" fill="#86EFAC" font-size="11" font-weight="500">agro-decision-support.org / region-caribe</text>

  <rect x="630" y="14" width="140" height="22" rx="6" fill="#2AA539" fill-opacity="0.15" stroke="#2AA539" stroke-width="1" />
  <circle cx="644" cy="25" r="3.5" fill="#2AA539" />
  <text x="654" y="29" fill="#86EFAC" font-size="11" font-weight="600">Soporte a la Decisión</text>

  <!-- Left Column: Field & Crop Monitoring -->
  <g transform="translate(24, 70)">
    <rect width="250" height="385" rx="8" fill="#142B20" stroke="#1C3D2B" stroke-width="1" />
    <text x="18" y="28" fill="#F0FDF4" font-size="13" font-weight="700">Parámetros Productivos</text>
    <text x="18" y="46" fill="#86EFAC" font-size="11">Monitoreo de parcela piloto (Cultivo Maíz/Yuca)</text>

    <g transform="translate(18, 65)">
      <rect width="214" height="65" rx="6" fill="#0C1A14" stroke="#1C3D2B" stroke-width="1" />
      <text x="14" y="22" fill="#86EFAC" font-size="10">Humedad de Suelo Estimada</text>
      <text x="14" y="46" fill="#F0FDF4" font-size="18" font-weight="700">68%</text>
      <text x="75" y="46" fill="#2AA539" font-size="11" font-weight="600">Nivel Óptimo de Riego</text>
    </g>

    <g transform="translate(18, 142)">
      <rect width="214" height="65" rx="6" fill="#0C1A14" stroke="#1C3D2B" stroke-width="1" />
      <text x="14" y="22" fill="#86EFAC" font-size="10">Pronóstico de Lluvias (7 días)</text>
      <text x="14" y="46" fill="#F0FDF4" font-size="18" font-weight="700">32 mm</text>
      <text x="75" y="46" fill="#38BDF8" font-size="11">Régimen favorable</text>
    </g>

    <g transform="translate(18, 220)">
      <rect width="214" height="65" rx="6" fill="#0C1A14" stroke="#1C3D2B" stroke-width="1" />
      <text x="14" y="22" fill="#86EFAC" font-size="10">Precio Mayorista en Central</text>
      <text x="14" y="46" fill="#F0FDF4" font-size="18" font-weight="700">$2,450 / kg</text>
      <text x="125" y="46" fill="#2AA539" font-size="11" font-weight="600">Tendencia ↑</text>
    </g>

    <g transform="translate(18, 298)">
      <rect width="214" height="65" rx="6" fill="#0C1A14" stroke="#1C3D2B" stroke-width="1" />
      <text x="14" y="22" fill="#86EFAC" font-size="10">Cálculo de Margen Neto</text>
      <text x="14" y="46" fill="#F0FDF4" font-size="18" font-weight="700">+34%</text>
      <text x="75" y="46" fill="#2AA539" font-size="11" font-weight="600">vs. Intermediario</text>
    </g>
  </g>

  <!-- Right Top: Actionable Decision Card (Core Value) -->
  <g transform="translate(294, 70)">
    <rect width="482" height="175" rx="8" fill="#142B20" stroke="#2AA539" stroke-width="1.5" />
    <rect x="18" y="16" width="130" height="22" rx="4" fill="#2AA539" fill-opacity="0.2" />
    <text x="26" y="31" fill="#86EFAC" font-size="10" font-weight="700">RECOMENDACIÓN TÉCNICA</text>
    
    <text x="18" y="65" fill="#F0FDF4" font-size="15" font-weight="700">Ventana Óptima de Cosecha y Comercialización</text>
    <text x="18" y="90" fill="#CBD5E1" font-size="12">
      Con base en la maduración del cultivo y el ciclo de precios en plazas mayoristas,
    </text>
    <text x="18" y="108" fill="#CBD5E1" font-size="12">
      se recomienda iniciar recolección en <tspan fill="#86EFAC" font-weight="700">5 días</tspan> para maximizar rentabilidad (+18%).
    </text>

    <!-- Action pills -->
    <rect x="18" y="130" width="140" height="28" rx="6" fill="#2AA539" />
    <text x="35" y="148" fill="#0C1A14" font-size="11" font-weight="700">Registrar Cosecha</text>

    <rect x="168" y="130" width="140" height="28" rx="6" fill="#0C1A14" stroke="#1C3D2B" stroke-width="1" />
    <text x="182" y="148" fill="#F0FDF4" font-size="11" font-weight="500">Ver Histórico Precios</text>
  </g>

  <!-- Right Bottom: Market Trends & Yield Estimation -->
  <g transform="translate(294, 260)">
    <rect width="482" height="195" rx="8" fill="#142B20" stroke="#1C3D2B" stroke-width="1" />
    <text x="20" y="26" fill="#F0FDF4" font-size="12" font-weight="600">Comparativa: Venta Directa vs. Acopio Tradicional</text>
    <text x="20" y="44" fill="#86EFAC" font-size="10">Modelamiento económico de rentabilidad para el productor</text>

    <!-- Chart Visual -->
    <line x1="30" y1="80" x2="450" y2="80" stroke="#1C3D2B" stroke-width="1" />
    <line x1="30" y1="120" x2="450" y2="120" stroke="#1C3D2B" stroke-width="1" />
    <line x1="30" y1="160" x2="450" y2="160" stroke="#1C3D2B" stroke-width="1" />

    <!-- Direct Sales curve -->
    <path d="M 40 150 Q 140 135, 240 105 T 440 70" fill="none" stroke="#2AA539" stroke-width="3" />
    <!-- Intermediary curve -->
    <path d="M 40 160 Q 140 155, 240 145 T 440 135" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="4 4" />

    <circle cx="440" cy="70" r="4" fill="#2AA539" />
    <circle cx="440" cy="135" r="4" fill="#64748B" />

    <!-- Legend -->
    <g transform="translate(40, 175)">
      <circle cx="5" cy="5" r="4" fill="#2AA539" />
      <text x="15" y="9" fill="#86EFAC" font-size="10">Estrategia Asistida por Datos (+34% margen)</text>
      <circle cx="260" cy="5" r="4" fill="#64748B" />
      <text x="270" y="9" fill="#94A3B8" font-size="10">Comercialización Convencional</text>
    </g>
  </g>
</svg>
