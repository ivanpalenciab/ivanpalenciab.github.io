<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Background -->
  <rect width="800" height="480" fill="#0A192F" rx="12" />
  <rect x="1" y="1" width="798" height="478" rx="11" stroke="#1E3A5F" stroke-width="2" />

  <!-- App Header -->
  <rect x="0" y="0" width="800" height="50" fill="#112240" rx="12" />
  <rect x="0" y="38" width="800" height="12" fill="#112240" />
  <line x1="0" y1="50" x2="800" y2="50" stroke="#1E3A5F" stroke-width="1" />
  <circle cx="28" cy="25" r="6" fill="#EF4444" opacity="0.8" />
  <circle cx="48" cy="25" r="6" fill="#F59E0B" opacity="0.8" />
  <circle cx="68" cy="25" r="6" fill="#10B981" opacity="0.8" />
  <rect x="100" y="14" width="240" height="22" rx="6" fill="#0A192F" />
  <text x="114" y="29" fill="#64FFDA" font-size="11" font-weight="500">sustainability-core.org / climate-metrics</text>

  <rect x="630" y="14" width="140" height="22" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1" />
  <circle cx="644" cy="25" r="3.5" fill="#10B981" />
  <text x="654" y="29" fill="#10B981" font-size="11" font-weight="600">Economía Circular</text>

  <!-- Left Overview Panel -->
  <g transform="translate(24, 70)">
    <rect width="230" height="385" rx="8" fill="#112240" stroke="#1E3A5F" stroke-width="1" />
    <text x="18" y="28" fill="#F8FAFC" font-size="13" font-weight="700">Trazabilidad Ambiental</text>
    <text x="18" y="46" fill="#8892B0" font-size="11">Monitoreo continuo de impacto</text>

    <!-- Circular Recovery Donut Graphic -->
    <g transform="translate(115, 130)">
      <circle cx="0" cy="0" r="55" fill="none" stroke="#233554" stroke-width="12" />
      <circle cx="0" cy="0" r="55" fill="none" stroke="#10B981" stroke-width="12" stroke-dasharray="245 345" stroke-linecap="round" transform="rotate(-90)" />
      <circle cx="0" cy="0" r="55" fill="none" stroke="#64FFDA" stroke-width="12" stroke-dasharray="60 345" stroke-dashoffset="-245" stroke-linecap="round" transform="rotate(-90)" />
      <text x="0" y="6" text-anchor="middle" fill="#F8FAFC" font-size="18" font-weight="800">78.4%</text>
      <text x="0" y="20" text-anchor="middle" fill="#8892B0" font-size="9">Circularidad</text>
    </g>

    <g transform="translate(18, 215)">
      <rect width="194" height="42" rx="6" fill="#0A192F" />
      <text x="12" y="18" fill="#8892B0" font-size="10">Residuos Revalorizados</text>
      <text x="12" y="34" fill="#64FFDA" font-size="13" font-weight="700">4,280 Toneladas</text>
    </g>

    <g transform="translate(18, 268)">
      <rect width="194" height="42" rx="6" fill="#0A192F" />
      <text x="12" y="18" fill="#8892B0" font-size="10">Huella de Carbono (tCO2e)</text>
      <text x="12" y="34" fill="#F8FAFC" font-size="13" font-weight="700">-18.6% reducción</text>
    </g>

    <g transform="translate(18, 321)">
      <rect width="194" height="42" rx="6" fill="#0A192F" />
      <text x="12" y="18" fill="#8892B0" font-size="10">Eficiencia de Recursos</text>
      <text x="12" y="34" fill="#10B981" font-size="13" font-weight="700">A+ Óptimo</text>
    </g>
  </g>

  <!-- Right Side Charts -->
  <g transform="translate(274, 70)">
    <!-- Top Grid of 2 Cards -->
    <rect width="240" height="180" rx="8" fill="#112240" stroke="#1E3A5F" stroke-width="1" />
    <text x="16" y="26" fill="#F8FAFC" font-size="12" font-weight="600">Balance de Materiales</text>
    <text x="16" y="42" fill="#8892B0" font-size="10">Entradas vírgenes vs. Recicladas</text>

    <!-- Bar Chart -->
    <g transform="translate(16, 65)">
      <text x="0" y="15" fill="#8892B0" font-size="10">Polímeros</text>
      <rect x="75" y="6" width="130" height="10" rx="3" fill="#233554" />
      <rect x="75" y="6" width="95" height="10" rx="3" fill="#10B981" />

      <text x="0" y="45" fill="#8892B0" font-size="10">Metales</text>
      <rect x="75" y="36" width="130" height="10" rx="3" fill="#233554" />
      <rect x="75" y="36" width="112" height="10" rx="3" fill="#64FFDA" />

      <text x="0" y="75" fill="#8892B0" font-size="10">Orgánicos</text>
      <rect x="75" y="66" width="130" height="10" rx="3" fill="#233554" />
      <rect x="75" y="66" width="80" height="10" rx="3" fill="#2AA539" />

      <text x="0" y="105" fill="#8892B0" font-size="10">Vidrio/Cartón</text>
      <rect x="75" y="96" width="130" height="10" rx="3" fill="#233554" />
      <rect x="75" y="96" width="122" height="10" rx="3" fill="#38BDF8" />
    </g>
  </g>

  <g transform="translate(534, 70)">
    <rect width="242" height="180" rx="8" fill="#112240" stroke="#1E3A5F" stroke-width="1" />
    <text x="16" y="26" fill="#F8FAFC" font-size="12" font-weight="600">Metas Climáticas 2026</text>
    <text x="16" y="42" fill="#8892B0" font-size="10">Cumplimiento normativa GHG Protocol</text>

    <!-- Goal Meter -->
    <g transform="translate(16, 65)">
      <rect width="210" height="16" rx="4" fill="#0A192F" stroke="#1E3A5F" stroke-width="1" />
      <rect width="168" height="16" rx="4" fill="#10B981" />
      <text x="5" y="12" fill="#0A192F" font-size="9" font-weight="700">80% Alcance 1 y 2</text>

      <g transform="translate(0, 32)">
        <text x="0" y="14" fill="#8892B0" font-size="10">Emisiones Directas</text>
        <text x="210" y="14" text-anchor="end" fill="#F8FAFC" font-size="10" font-weight="600">312 tCO2e</text>
      </g>
      <g transform="translate(0, 52)">
        <text x="0" y="14" fill="#8892B0" font-size="10">Consumo Energético</text>
        <text x="210" y="14" text-anchor="end" fill="#F8FAFC" font-size="10" font-weight="600">1,420 MWh</text>
      </g>
      <g transform="translate(0, 72)">
        <text x="0" y="14" fill="#8892B0" font-size="10">Tasa de Desvío de Vertederos</text>
        <text x="210" y="14" text-anchor="end" fill="#64FFDA" font-size="10" font-weight="600">91.3%</text>
      </g>
    </g>
  </g>

  <!-- Bottom Wide Table/Flow Panel -->
  <g transform="translate(274, 268)">
    <rect width="502" height="187" rx="8" fill="#112240" stroke="#1E3A5F" stroke-width="1" />
    <text x="20" y="28" fill="#F8FAFC" font-size="12" font-weight="600">Auditoría y Flujo de Gestión de Recursos</text>
    <text x="20" y="44" fill="#8892B0" font-size="10">Integración de datos de pesaje, plantas y manifiestos de disposición</text>

    <!-- Table header -->
    <rect x="16" y="58" width="470" height="24" rx="4" fill="#1E3A5F" />
    <text x="26" y="74" fill="#8892B0" font-size="10" font-weight="600">LOTE RESIDUO</text>
    <text x="130" y="74" fill="#8892B0" font-size="10" font-weight="600">PLANTA DESTINO</text>
    <text x="270" y="74" fill="#8892B0" font-size="10" font-weight="600">PESO CERTIFICADO</text>
    <text x="395" y="74" fill="#8892B0" font-size="10" font-weight="600">DICTAMEN</text>

    <!-- Row 1 -->
    <text x="26" y="105" fill="#F8FAFC" font-size="11">RES-ECO-8821</text>
    <text x="130" y="105" fill="#8892B0" font-size="11">BioTransformadora Norte</text>
    <text x="270" y="105" fill="#8892B0" font-size="11">14.2 Tons</text>
    <rect x="395" y="93" width="78" height="18" rx="4" fill="#10B981" fill-opacity="0.2" />
    <text x="404" y="106" fill="#10B981" font-size="10" font-weight="600">Reincorporado</text>

    <!-- Row 2 -->
    <text x="26" y="135" fill="#F8FAFC" font-size="11">RES-ECO-8822</text>
    <text x="130" y="135" fill="#8892B0" font-size="11">Centro Reciclaje Andino</text>
    <text x="270" y="135" fill="#8892B0" font-size="11">8.7 Tons</text>
    <rect x="395" y="123" width="78" height="18" rx="4" fill="#10B981" fill-opacity="0.2" />
    <text x="404" y="136" fill="#10B981" font-size="10" font-weight="600">Reincorporado</text>

    <!-- Row 3 -->
    <text x="26" y="165" fill="#F8FAFC" font-size="11">RES-ECO-8823</text>
    <text x="130" y="165" fill="#8892B0" font-size="11">Planta de Compostaje</text>
    <text x="270" y="165" fill="#8892B0" font-size="11">22.1 Tons</text>
    <rect x="395" y="153" width="78" height="18" rx="4" fill="#64FFDA" fill-opacity="0.2" />
    <text x="406" y="166" fill="#64FFDA" font-size="10" font-weight="600">En Proceso</text>
  </g>
</svg>
