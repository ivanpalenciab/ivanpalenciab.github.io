<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Background -->
  <rect width="800" height="480" fill="#0B1120" rx="12" />
  <rect x="1" y="1" width="798" height="478" rx="11" stroke="#1E293B" stroke-width="2" />

  <!-- App Header -->
  <rect x="0" y="0" width="800" height="50" fill="#151E32" rx="12" />
  <rect x="0" y="38" width="800" height="12" fill="#151E32" />
  <line x1="0" y1="50" x2="800" y2="50" stroke="#1E293B" stroke-width="1" />
  <circle cx="28" cy="25" r="6" fill="#EF4444" opacity="0.8" />
  <circle cx="48" cy="25" r="6" fill="#F59E0B" opacity="0.8" />
  <circle cx="68" cy="25" r="6" fill="#10B981" opacity="0.8" />
  <rect x="100" y="14" width="280" height="22" rx="6" fill="#0B1120" />
  <text x="114" y="29" fill="#94A3B8" font-size="11" font-weight="500">ml-engine.predict / customer-ticket-prediction</text>

  <rect x="610" y="14" width="160" height="22" rx="6" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-width="1" />
  <circle cx="624" cy="25" r="3.5" fill="#6366F1" />
  <text x="634" y="29" fill="#A5B4FC" font-size="11" font-weight="600">ML: Regressor + XGBoost</text>

  <!-- Metrics Bar -->
  <g transform="translate(24, 68)">
    <rect width="176" height="74" rx="8" fill="#151E32" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="24" fill="#94A3B8" font-size="10" font-weight="600">R² SCORE (TEST SET)</text>
    <text x="14" y="52" fill="#F8FAFC" font-size="22" font-weight="800">0.942</text>
    <text x="80" y="52" fill="#10B981" font-size="11" font-weight="600">vs 0.86 baseline</text>
  </g>

  <g transform="translate(216, 68)">
    <rect width="176" height="74" rx="8" fill="#151E32" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="24" fill="#94A3B8" font-size="10" font-weight="600">MAPE (ERROR %)</text>
    <text x="14" y="52" fill="#F8FAFC" font-size="22" font-weight="800">3.8%</text>
    <text x="75" y="52" fill="#10B981" font-size="11" font-weight="600">↓ Residual óptimo</text>
  </g>

  <g transform="translate(408, 68)">
    <rect width="176" height="74" rx="8" fill="#151E32" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="24" fill="#94A3B8" font-size="10" font-weight="600">TICKET ESTIMADO</text>
    <text x="14" y="52" fill="#F8FAFC" font-size="22" font-weight="800">$142.50</text>
    <text x="105" y="52" fill="#38BDF8" font-size="11">Intervalo 95%</text>
  </g>

  <g transform="translate(600, 68)">
    <rect width="176" height="74" rx="8" fill="#151E32" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="24" fill="#94A3B8" font-size="10" font-weight="600">VALIDACIÓN</text>
    <text x="14" y="52" fill="#F8FAFC" font-size="18" font-weight="800">SciELO 2025</text>
    <text x="14" y="68" fill="#A5B4FC" font-size="10">Paper Científico</text>
  </g>

  <!-- Main Forecast Chart Panel -->
  <g transform="translate(24, 158)">
    <rect width="490" height="298" rx="8" fill="#151E32" stroke="#1E293B" stroke-width="1" />
    <text x="20" y="30" fill="#F8FAFC" font-size="13" font-weight="700">Predicción de Ticket de Compra vs. Valores Observados</text>
    <text x="20" y="48" fill="#94A3B8" font-size="11">Evaluación del modelo sobre transacciones individuales del cliente</text>

    <!-- Chart lines grid -->
    <line x1="30" y1="80" x2="460" y2="80" stroke="#1E293B" stroke-width="1" />
    <line x1="30" y1="130" x2="460" y2="130" stroke="#1E293B" stroke-width="1" />
    <line x1="30" y1="180" x2="460" y2="180" stroke="#1E293B" stroke-width="1" />
    <line x1="30" y1="230" x2="460" y2="230" stroke="#1E293B" stroke-width="1" />

    <!-- Split line: History vs Forecast -->
    <line x1="280" y1="65" x2="280" y2="250" stroke="#64748B" stroke-dasharray="4 4" stroke-width="1.5" />
    <rect x="225" y="66" width="52" height="18" rx="3" fill="#0B1120" />
    <text x="230" y="79" fill="#94A3B8" font-size="9">Transacciones</text>
    <rect x="285" y="66" width="62" height="18" rx="3" fill="#0B1120" />
    <text x="290" y="79" fill="#10B981" font-size="9" font-weight="600">Predicción Ticket</text>

    <!-- Confidence Interval Cone (Forecast) -->
    <path d="M 280 148 Q 350 115, 450 85 L 450 190 Q 350 170, 280 148 Z" fill="#6366F1" opacity="0.18" />

    <!-- Historical line (Grayish blue) -->
    <path d="M 40 210 Q 70 190, 100 195 T 160 170 T 220 160 T 280 148" fill="none" stroke="#94A3B8" stroke-width="2.5" />

    <!-- Forecast line (Green accent) -->
    <path d="M 280 148 Q 350 140, 450 135" fill="none" stroke="#2AA539" stroke-width="3" />
    <!-- Upper bound -->
    <path d="M 280 148 Q 350 115, 450 85" fill="none" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="3 3" />
    <!-- Lower bound -->
    <path d="M 280 148 Q 350 170, 450 190" fill="none" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="3 3" />

    <circle cx="280" cy="148" r="5" fill="#2AA539" />
    <circle cx="450" cy="135" r="5" fill="#2AA539" />

    <!-- Legend -->
    <g transform="translate(30, 265)">
      <circle cx="10" cy="8" r="4" fill="#94A3B8" />
      <text x="20" y="12" fill="#94A3B8" font-size="11">Datos Observados</text>

      <circle cx="150" cy="8" r="4" fill="#2AA539" />
      <text x="160" y="12" fill="#94A3B8" font-size="11">Pronóstico Modelo</text>

      <rect x="290" y="4" width="16" height="8" rx="2" fill="#6366F1" opacity="0.3" />
      <text x="312" y="12" fill="#94A3B8" font-size="11">Intervalo de Confianza (95%)</text>
    </g>
  </g>

  <!-- Right Side: Feature Importance Panel -->
  <g transform="translate(530, 158)">
    <rect width="246" height="298" rx="8" fill="#151E32" stroke="#1E293B" stroke-width="1" />
    <text x="18" y="30" fill="#F8FAFC" font-size="13" font-weight="700">Importancia de Variables</text>
    <text x="18" y="48" fill="#94A3B8" font-size="11">SHAP values / Feature weights</text>

    <!-- Feature 1 -->
    <g transform="translate(18, 70)">
      <text x="0" y="12" fill="#F8FAFC" font-size="11">Historial de Gasto (Monto)</text>
      <text x="210" y="12" text-anchor="end" fill="#10B981" font-size="11" font-weight="600">34%</text>
      <rect x="0" y="20" width="210" height="8" rx="4" fill="#0B1120" />
      <rect x="0" y="20" width="160" height="8" rx="4" fill="#2AA539" />
    </g>

    <!-- Feature 2 -->
    <g transform="translate(18, 115)">
      <text x="0" y="12" fill="#F8FAFC" font-size="11">Frecuencia Transaccional</text>
      <text x="210" y="12" text-anchor="end" fill="#10B981" font-size="11" font-weight="600">26%</text>
      <rect x="0" y="20" width="210" height="8" rx="4" fill="#0B1120" />
      <rect x="0" y="20" width="125" height="8" rx="4" fill="#10B981" />
    </g>

    <!-- Feature 3 -->
    <g transform="translate(18, 160)">
      <text x="0" y="12" fill="#F8FAFC" font-size="11">Recencia de Última Compra</text>
      <text x="210" y="12" text-anchor="end" fill="#6366F1" font-size="11" font-weight="600">18%</text>
      <rect x="0" y="20" width="210" height="8" rx="4" fill="#0B1120" />
      <rect x="0" y="20" width="90" height="8" rx="4" fill="#6366F1" />
    </g>

    <!-- Feature 4 -->
    <g transform="translate(18, 205)">
      <text x="0" y="12" fill="#F8FAFC" font-size="11">Mix de Categorías / Items</text>
      <text x="210" y="12" text-anchor="end" fill="#6366F1" font-size="11" font-weight="600">14%</text>
      <rect x="0" y="20" width="210" height="8" rx="4" fill="#0B1120" />
      <rect x="0" y="20" width="70" height="8" rx="4" fill="#6366F1" />
    </g>

    <!-- Feature 5 -->
    <g transform="translate(18, 250)">
      <text x="0" y="12" fill="#F8FAFC" font-size="11">Estacionalidad de Compra</text>
      <text x="210" y="12" text-anchor="end" fill="#94A3B8" font-size="11" font-weight="600">8%</text>
      <rect x="0" y="20" width="210" height="8" rx="4" fill="#0B1120" />
      <rect x="0" y="20" width="45" height="8" rx="4" fill="#475569" />
    </g>
  </g>
</svg>
